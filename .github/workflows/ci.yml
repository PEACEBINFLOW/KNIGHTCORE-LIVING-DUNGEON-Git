name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json is committed yet, so `npm ci` cannot be used.
      # Once you commit a lockfile, replace this step with: npm ci
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test
